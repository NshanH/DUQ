  --shadow-2:var(--shadow-glass_card_lift);
  --shadow-3:var(--shadow-glass_pop);
  --shadow-pill-hover:var(--shadow-pill_hover);
  --shadow-pill-press:var(--shadow-pill_press);

  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.45,.64,1); --ease:cubic-bezier(.2,.7,.2,1);
  --dash:repeating-linear-gradient(90deg,var(--hairline) 0 4px,transparent 4px 8px);   /* Figma divider 857:47955 */
}
@supports not (backdrop-filter:blur(1px)){:root{--card:var(--surface-surface_1);--glass-side:var(--surface-surface_1);--glass-pop:var(--surface-surface_1)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--surface-surface_1);--glass-side:var(--surface-surface_1);--glass-field:var(--surface-surface_1);--glass-pop:var(--surface-surface_1);--blur:0px;--glass-sat:1}}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 4px var(--bg)}
h1[tabindex]:focus-visible,#main:focus-visible,#landing .headline:focus-visible{outline:none;box-shadow:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:inherit}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--pill);color:#fff;padding:10px 16px;border-radius:var(--r2);font-weight:600;text-decoration:none;transition:top 200ms}
.skip:focus{top:16px}
svg.i{width:20px;height:20px;flex:none;display:block}
.brand{--ink:#0e1117;--accent:var(--brand);line-height:1;text-decoration:none;display:inline-flex;align-items:center}
.brand .wm{height:33px;width:auto;display:block;overflow:visible}
.top .brand .wm{height:29px}
/* .brand is the single hook for the final logo: replace its text with the mark once chosen. */

/* ============================================================
   Ground — one flat colour (--bg); the light-blob layer is gone
   ============================================================ */

/* ============================================================
   App frame
   ============================================================ */
.app{position:relative;display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh;align-items:start}
body.is-landing .app{display:none}

/* sidebar */
.side{padding:24px 16px;border-right:1px solid var(--hairline);background:var(--glass-side);backdrop-filter:blur(30px) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(30px) saturate(var(--glass-sat));position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.side .brand{padding:0 10px;margin-bottom:20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a.grp-link{display:flex;align-items:center;justify-content:space-between;text-decoration:none;cursor:pointer;border-radius:10px}
.nav a.grp-link:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.nav a.grp-link [data-icon]{width:14px;height:14px;display:inline-flex;opacity:.6}
.nav .sep{border:0;height:1px;background:var(--hairline);margin:10px 10px}
.nav .grp{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:16px 10px 6px}
.nav a{display:block;width:100%;padding:9px 16px;border-radius:var(--r2);font-weight:500;color:var(--ink-2);text-align:left;text-decoration:none;transition:background 200ms,transform 300ms var(--spring)}
.nav a:hover{background:var(--glass-field);color:var(--ink);transform:translateX(2px)}
.nav a[aria-current=page]{background:var(--pill);color:#fff;font-weight:600}
.proto{margin-top:auto;padding-top:16px;position:relative}
.proto>button{font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 10px;border-radius:var(--r2)}
.proto>button:hover{color:var(--ink);background:var(--glass-field)}
.proto-menu{position:absolute;left:0;bottom:calc(100% + 4px);min-width:200px;background:var(--glass-pop);backdrop-filter:blur(24px) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(24px) saturate(var(--glass-sat));border:1px solid var(--hairline);border-radius:var(--r-22);padding:6px;box-shadow:var(--shadow-3);z-index:20;max-height:70vh;overflow-y:auto}
.proto-menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:16px;font-size:13px;font-weight:600;color:var(--ink-2)}
.proto-menu button:hover{background:rgba(8,11,15,.06);color:var(--ink)}
.proto-menu button[aria-checked=true]{color:var(--ink)}
.proto-menu button[aria-checked=true]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:8px;vertical-align:middle}
.proto-group+.proto-group{margin-top:4px;padding-top:4px;border-top:1px solid var(--hairline)}
.proto-group .glbl{padding:7px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* top bar */
.main{width:100%;padding:20px 28px 60px;max-width:1440px;min-width:0;margin-inline:auto}   /* width:100% keeps the column filling its track: auto inline margins alone make a grid item shrink to fit its content. The column (its 28 padding included) grows with the window up to 1440 and then centres in what is left — rule E below */
/* the top bar stays: on scroll it drops onto a matte ground and shrinks (Figma "32. Event — scrolled") */
.top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:45;margin:-20px -28px 20px;padding:20px 28px 12px;transition:padding 200ms var(--ease)}
.top::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:var(--bg);backdrop-filter:blur(14px) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(14px) saturate(var(--glass-sat));-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent);transition:opacity 220ms var(--ease)}
.top.scrolled::before{opacity:.92}
.top.scrolled{padding-top:10px;padding-bottom:10px}
.top.scrolled .search{height:36px}
.top.scrolled .bal small{display:none}
.top.scrolled .bal{min-height:36px}
.top.scrolled .btn{height:36px;padding:0 16px}
.top.scrolled .themebtn{width:30px;height:30px}
.top .brand{display:none}
/* search is 360 in the Top Bar, top and scrolled alike (Figma Top Bar 37:83, 23 Sep 2026); it may shrink on a narrow window, never grows */
.search{flex:0 1 360px;max-width:360px;height:44px;border-radius:var(--r2);background:var(--glass-field);border:1px solid var(--hairline);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink-3);transition:box-shadow 300ms}
.search:focus-within{box-shadow:var(--shadow);outline:2px solid var(--focus);outline-offset:3px}
.search input{flex:1;border:0;background:transparent;appearance:none;-webkit-appearance:none;box-shadow:none;font:inherit;color:var(--ink);outline:none;min-width:0;border-radius:0}
.search input::-webkit-search-decoration,.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px transparent inset;transition:background-color 9999s}
.search{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:6px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 24px 60px rgba(8,11,15,.16)}
.sugg a{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600}
.sugg a:hover,.sugg a[aria-selected=true]{background:rgba(8,11,15,.06)}
.sugg a small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.sugg a .pct{font-weight:800;font-variant-numeric:tabular-nums}
.sugg .all{display:flex;justify-content:center;padding:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.sugg .none{padding:12px 10px;font-size:13px;color:var(--ink-2)}
.search input::placeholder{color:var(--ink-3);opacity:1}
.search kbd{font:600 12px/1 var(--font);color:var(--ink-3);border:1px solid var(--hairline);border-radius:var(--r-6);padding:4px 6px}
.search:focus-within kbd{opacity:0}
.sp{flex:1}
.bal{display:flex;flex-direction:column;gap:4px;align-items:flex-end;line-height:1.2;margin-right:4px;min-height:44px;justify-content:center;padding:0 6px;border-radius:var(--r-14);text-decoration:none}
.bal small{white-space:nowrap;font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bal b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bal .arr{display:block;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:none;letter-spacing:0}
.btn{white-space:nowrap;height:44px;padding:0 20px;border-radius:var(--r2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform 300ms var(--spring),background 200ms,box-shadow 200ms}
.btn:active{transform:scale(.97)}
.top .btn.ghost{background:none}   /* Figma Top Bar: Deposit и My account рисуются без заливки */
.btn.account[aria-current=page]{background:var(--pill);color:#fff}
.btn.ghost{color:var(--ink);background:var(--glass-field);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.ghost:hover{background:var(--card-2)}.btn.ghost:active{background:rgba(8,11,15,.08)}
.btn.icon{width:44px;padding:0}
.btn.ink{background:var(--pill);color:#fff;box-shadow:var(--shadow-pill)}
.btn.ink:hover{background:var(--pill-hover);box-shadow:var(--shadow-pill-hover);transform:translateY(-1px)}
.btn.ink:active{background:var(--pill-press);box-shadow:var(--shadow-pill-press);transform:scale(.97)}
.btn.ink:disabled{background:var(--pill-disabled);color:var(--ink-3);box-shadow:none;opacity:1;transform:none;cursor:default}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn.textlink{height:auto;padding:0;background:none;color:var(--ink-2);font-weight:600;text-decoration:underline;text-underline-offset:3px;border-radius:var(--r-6)}
.btn.textlink:hover{color:var(--ink)}

.view{display:none}.view.on{display:block;animation:in 560ms var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
.stagger>*{animation:rise 600ms var(--spring) both}
.stagger>*:nth-child(1){animation-delay:40ms}.stagger>*:nth-child(2){animation-delay:100ms}.stagger>*:nth-child(3){animation-delay:160ms}.stagger>*:nth-child(4){animation-delay:220ms}.stagger>*:nth-child(5){animation-delay:280ms}.stagger>*:nth-child(6){animation-delay:340ms}.stagger>*:nth-child(7){animation-delay:400ms}.stagger>*:nth-child(8){animation-delay:460ms}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--glass-sat));transition:transform 400ms var(--spring),box-shadow 400ms}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.eyebrow{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.d{font-weight:700;font-size:13px}.d.up{color:var(--yes-text)}.d.down{color:var(--no-text)}.d.flat{color:var(--ink-3)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{height:44px;border-radius:var(--r2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform 300ms var(--spring),filter 200ms,background 200ms}
.yn button:active{transform:scale(.96)}
.yn .y{background:var(--yes-bg);color:var(--yes-label)}.yn .n{background:var(--no-bg);color:var(--no-label)}
.yn .y small{color:var(--yes-text)}.yn .n small{color:var(--no-text)}
.yn button:hover{filter:brightness(.97);transform:translateY(-1px)}
.yn small{font-weight:600;font-size:13px}
.yn button[aria-pressed=true].y{box-shadow:inset 0 0 0 2px var(--yes-fill)}
.yn button[aria-pressed=true].n{box-shadow:inset 0 0 0 2px var(--no-fill)}
.yn button:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.yn.done .rr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:40px;padding:4px 12px;border-radius:var(--r2);font-weight:800;font-size:15px;letter-spacing:-.01em;text-align:center}
.yn.done .rr.y{background:var(--yes-fill);color:#fff}
.yn.done .rr.n{background:var(--no-fill);color:#fff}
.yn.done .rr.g{background:var(--card-2);color:var(--ink-2)}
.yn.done .rr small{font-weight:600;font-size:11px;letter-spacing:.02em;opacity:.85}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:var(--r-6);font-size:12px;line-height:17px;font-weight:700}
.chip b{font-weight:inherit}   /* the label is one weight: the browser renders <b> as "bolder", which against the chip's 700 lands on 900 */
.chip.y{background:var(--yes-bg);color:var(--yes-text)}.chip.n{background:var(--no-bg);color:var(--no-text)}.chip.g{background:var(--card-2);color:var(--ink-2)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--hairline)}
.tabs button{padding:10px 14px 0 0;font-weight:600;color:var(--ink-3);position:relative;min-height:44px}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:var(--r2)}
.flash{animation:flash 500ms var(--ease)}
@keyframes flash{0%{background:rgba(8,11,15,.06)}100%{background:transparent}}
.roll{display:inline-block;transition:transform 240ms var(--spring)}
.roll.bump{transform:translateY(-3px)}
.empty{padding:36px 24px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:16px;line-height:1.5;margin-bottom:4px}
.empty .btn{margin-top:10px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.err{font-size:12px;color:var(--no-text);font-weight:600;margin-top:6px}

/* photo tiles */
.pic{display:block;object-fit:cover;border-radius:var(--r-14);flex:none;box-shadow:var(--shadow-tile);outline:1px solid rgba(8,11,15,.08);outline-offset:-1px;background:var(--card-2)}
.pic.md{width:44px;height:44px;border-radius:12px}

.pic.ev{width:64px;height:64px;border-radius:var(--r-18)}
.pic.xl{width:84px;height:84px;border-radius:var(--r-22)}
.pic.ev,.pic.xl{box-shadow:var(--shadow-tile),0 8px 20px rgba(8,11,15,.06)}

/* ============================================================
   HOME
   ============================================================ */

.facts{margin:12px 0 18px;font-size:13px;color:var(--ink-2)}.facts b{color:var(--ink);font-weight:600}

.fx{display:flex;flex-direction:column;gap:4px;margin-top:4px;max-width:420px}

@media (max-width:1000px){.fslide{grid-template-columns:1fr;height:auto}}
.chart{width:100%;display:block;border-radius:var(--r-10)}

/* ---- event chart «Подписи у линий»: the chart proposal page (DUQ Event Chart, variant B), on the system's tokens.
   Colours, line widths, dots, gaps and type come from tokens.css; the script reads its geometry back from the
   custom properties on .lb. No token exists for the plot height 296 / 250, its top inset 34 / 30, the value size 20,
   the name line 15 / 13 and the phone type 11, the 9 px cursor dot and the 12 / 16 px pick distance — those stay literal. ---- */
.vhost{position:relative;min-height:200px}
.v-labels .lb{--lb-h:296px;--lb-pt:34px;--lb-pb:var(--spacing-6xl);--lb-vlh:var(--typeface-line_height-title_2);--lb-nlh:15px;--lb-gap:var(--spacing-xs);
  --lb-ld:var(--spacing-4xl);--lb-dot:var(--sizing-dot-md);--lb-tx:var(--spacing-7);--lb-ph:var(--spacing-22);--lb-py:var(--spacing-xs);--lb-hy:var(--spacing-sm);
  --lb-ay:var(--spacing-md);--lb-pw:var(--spacing-4xl);--lb-hov:9px;--lb-near:12px;--lb-vs:20px;--lb-ns:var(--typeface-size-caption_1);--lb-as:var(--typeface-size-caption_1)}
.v-labels .lb.is-sm{--lb-h:250px;--lb-pt:30px;--lb-pb:var(--spacing-5xl);--lb-vlh:var(--typeface-line_height-caption_1);--lb-nlh:13px;--lb-gap:var(--spacing-3);
  --lb-ld:var(--spacing-xxl);--lb-dot:var(--sizing-dot-sm);--lb-tx:var(--spacing-5);--lb-ph:var(--spacing-4xl);--lb-py:var(--spacing-3);--lb-hy:var(--spacing-5);
  --lb-pw:var(--spacing-2xl);--lb-hov:var(--sizing-dot-md);--lb-near:16px;--lb-vs:var(--typeface-size-title_2);--lb-ns:11px;--lb-as:11px}
.v-labels .lb{font-variant-numeric:tabular-nums}   /* the page sets tabular figures on everything */
.v-labels .lb-top{height:var(--spacing-2xl)}   /* no period switch: the chart always shows the whole history */
.v-labels .lb-box{position:relative}
.v-labels .lb-svg{display:block;overflow:visible;touch-action:pan-y;-webkit-user-select:none;user-select:none;border-radius:var(--r-10)}
.v-labels .lb-svg:focus-visible{outline:var(--sizing-border-ring) solid var(--focus);outline-offset:var(--sizing-border-focus_gap)}
.v-labels .lb-grid line{stroke:var(--chart-grid);stroke-width:var(--sizing-border-hairline);shape-rendering:crispEdges}
.v-labels .lb-ax text{fill:var(--ink-3);font-family:var(--font);font-size:var(--lb-as);font-weight:var(--typeface-weight-primary-medium);text-anchor:middle}
.v-labels .lb-in{animation:lb-in 320ms var(--ease) both}
@keyframes lb-in{from{opacity:0}}
.v-labels .lb-line{fill:none;stroke-width:var(--sizing-border-chart_ghost);stroke-linecap:round;stroke-linejoin:round;transition:opacity 260ms var(--ease),stroke-width 260ms var(--ease)}
.v-labels .lb-line.is-focus{stroke-width:var(--sizing-border-chart_line_thin)}
.v-labels .lb-lead{fill:none;stroke-width:var(--sizing-border-chart_ghost);stroke-linecap:round;opacity:.5;transition:opacity 220ms var(--ease)}
.v-labels .lb-cur{opacity:0;pointer-events:none;transition:opacity 180ms var(--ease)}
.v-labels .is-scrub .lb-cur{opacity:1}
.v-labels .lb.is-scrub .lb-lead{opacity:0}
.v-labels .lb-hair{stroke:var(--chart-hover);stroke-width:var(--sizing-border-hairline)}
.v-labels .lb-dot{stroke:var(--chart-dot-bg);stroke-width:var(--sizing-border-ring);transition:opacity 260ms var(--ease)}
.v-labels .lb-pill{fill:var(--neutral_inverse_white-alpha_8)}
html[data-theme=dark] .v-labels .lb-pill{fill:var(--neutral_inverse_white-alpha_12)}   /* the page's card-3: 8 % ink in light, 12 % white in dark */
.v-labels .lb-when{fill:var(--ink);font-family:var(--font);font-size:var(--lb-as);font-weight:var(--typeface-weight-primary-semibold);text-anchor:middle}
.v-labels .has-focus .lb-line:not(.is-focus),.v-labels .has-focus .lb-dot:not(.is-focus){opacity:.25}
.v-labels .has-focus .lb-lead:not(.is-focus){opacity:.12}
.v-labels .lb-gut{position:absolute;left:0;top:0}
.v-labels .lb-lab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:flex-start;padding:0 0 0 calc(var(--lb-dot) + var(--lb-tx));white-space:nowrap;text-align:left;border-radius:var(--r-10);transition:transform 420ms var(--spring)}
.v-labels .is-scrub .lb-lab{transition:transform 240ms var(--ease)}
.v-labels .lb-lab i{position:absolute;left:0;top:calc(var(--lb-vlh) / 2 - var(--lb-dot) / 2);width:var(--lb-dot);height:var(--lb-dot);border-radius:var(--radius-border_radius_round);background:var(--c);transition:opacity 260ms var(--ease)}
.v-labels .lb-lab .v{font-size:var(--lb-vs);line-height:var(--lb-vlh);font-weight:var(--typeface-weight-primary-extrabold);letter-spacing:var(--typeface-letter_spacing-sm);color:var(--ink);transition:color 260ms var(--ease)}
.v-labels .lb-lab .n{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:var(--lb-ns);line-height:var(--lb-nlh);font-weight:var(--typeface-weight-primary-medium);color:var(--ink-3);transition:color 260ms var(--ease)}
.v-labels .is-sm .lb-lab .n{max-width:96px}   /* a long market name ends in an ellipsis; the full name is the label's title */
.v-labels .has-focus .lb-lab:not(.is-focus) .v,.v-labels .has-focus .lb-lab:not(.is-focus) .n{color:var(--ink-4)}
.v-labels .has-focus .lb-lab:not(.is-focus) i{opacity:.25}
.v-labels .has-focus .lb-lab.is-focus .n{color:var(--ink)}
.v-labels .lb-probe{visibility:hidden;pointer-events:none}
.v-labels .is-init .lb-lab,.v-labels .is-still *{transition:none!important;animation:none!important}
.rules{font-size:14px;color:var(--ink-2);line-height:1.6;max-width:70ch;padding:12px 0 4px}

.ochead::before{content:"";position:absolute;left:11px;top:50%;transform:translateY(-50%);width:6px;height:40px;border-radius:var(--r2);background:var(--c,transparent);opacity:var(--series-dim);transition:opacity 200ms}

.ochead .ch{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:4px 0;border-radius:var(--r-6);line-height:1.15}

/* an open row and its body are split by the dashed divider 857:47955: a 2 px band, the 1 px dash in its top row,
   then the body's 18 (Figma expanded outcome cards, 23 Sep 2026) — it replaces the solid 1 px rule */
/* the body sits on the card's own glass, like the row above it: an expanded market card is one surface/glass_card fill
   with no wash under the body, in light and dark alike (Figma «Outcome — More than 30 days» on 54, 25 Sep 2026).
   --ocb stays as the body's wash for the sticky table headers, now clear */
.ocbody{--ocb:transparent;--ocpad:var(--spacing-3xl);display:none;padding:calc(var(--spacing-3xl) + 2px) var(--ocpad) var(--spacing-3xl);background:var(--dash) 0 0/100% 1px no-repeat,var(--ocb)}
.oc.open .ocbody{display:block;animation:in 400ms var(--spring)}

.otabs{border:0;margin-bottom:16px}   /* Figma Outcome Body: the content column puts 16 between the tab bar and the pane */
/* Orders tab: Open | History switch, then the list. The list is a window — header plus seven rows,
   the rest scrolls inside it while the page stays put (order-history, 17 Sep 2026). */
.seg.mini{display:inline-flex;grid-template-columns:none;width:auto;gap:4px;padding:4px;margin:0 0 16px}
.seg.mini button{height:32px;padding:0 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.seg.mini .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 6px;border-radius:var(--r2);background:var(--card-2);font-size:12px;font-weight:700;color:var(--ink-2)}
.seg.mini button[aria-pressed=true] .cnt{background:var(--color-white-12);color:#fff}
.owin{max-height:403px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
/* the header stays put and only the rows scroll under it — Figma Outcome Body "· history" draws the 403 table as a
   Header over the clipped content (24 Sep 2026). It is sticky inside the window, so it also travels sideways with
   its columns; its ground repeats the market body's own layers (page, card glass, body wash), so at rest it
   cannot be told from the body and a row scrolling under it disappears. */
.owin .hhead,.owin .ohead{position:sticky;top:0;z-index:1;background:linear-gradient(var(--ocb),var(--ocb)),linear-gradient(var(--card),var(--card)),var(--bg)}
/* a table never squeezes its columns into each other: once the market is narrower than the table, it scrolls
   sideways (the user, 24 Sep 2026). Both scrollers reach the card's edges with the body's padding kept inside,
   so the rows slide under the card's edge and the window's scrollbar sits in the body's gutter. */
.oxs{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin}
.oxs,.owin{margin-inline:calc(-1 * var(--ocpad));padding-inline:var(--ocpad)}
/* desktop: one grid for the whole table and every row a subgrid of it, so the columns of all rows stay in line.
   The columns share the width equally, as drawn, but none gets narrower than its longest cell in any row; when
   they no longer fit, the grid runs past the market and the scroller takes it sideways. The last 2px track and
   its gap stand in for the body's end padding, so a table scrolled to its end stops the same 18 short of the
   card's edge as it does at rest; rules, fades and placeholders stop with the columns. */
@media (width > 900px){
  .oxs,.owin{padding-inline-end:0}
  .otw{display:grid;grid-template-columns:63px repeat(6,minmax(max-content,1fr)) calc(var(--ocpad) - 16px);column-gap:16px}
  .ordtbl .otw{grid-template-columns:63px repeat(4,minmax(max-content,1fr)) 90px calc(var(--ocpad) - 16px)}
  .otw>*{grid-column:1/-2}
  .otw>.hrow,.otw>.orow{grid-column:1/-1;grid-template-columns:subgrid}
}

.tline{height:1px;background:var(--dash);margin:4px 0}

/* History is fetched, so the fetch is drawn: a 36px skeleton line stands where each row will land —
   two of them for the first page, one at the foot of the window for the next twenty (Figma Outcome Body
   "· history loading"). A page that fails leaves the outlined pill as the only Show more there is. */
.ohpend{padding:12px 0}

@media (max-width:900px){
  /* phone: the same window around a PRICE · SHARES · VALUE header, one card per order */
  .hrow{grid-template-columns:1fr 1fr 1fr;gap:6px 10px;padding:10px 0}
  .hrow.hhead{grid-template-columns:1fr 1fr 1fr;padding-bottom:6px}
  .hrow.hhead span:nth-child(-n+3),.hrow.hhead span:nth-child(7){display:none}
  .hrow>.chip{grid-column:1}
  .hrow .tm{grid-column:1/-1;text-align:right}
  .top::before{-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
}
/* Resolution tab: sections built from the file's own blocks, parted by the quiet rule. A state renders only
   the sections it has, and .rsec supplies the divider between whichever survive — never one at the top. */
.rsec{margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline)}
.rsec:first-child{margin-top:0;padding-top:0;border-top:0}
/* the rules sit under the dashed divider 857:47955 with 18 below it, not under the solid Section Divider 298:7098
   (Figma Outcome Body/Resolution rules, 23 Sep 2026); the sections above them keep the solid rule */
.rsec:not(:first-child):has(>.rules){border-top:0;padding-top:19px;background:var(--dash) 0 0/100% 1px no-repeat}
.opane .resolved{padding:0}
.opane .resolved .tag{margin-bottom:0}   /* the status section spaces itself: 12 to the ladder or the facts, 14 to the rule */
.opane .steps{margin:12px 0 0}
.opane .kv{margin:12px 0 0}
.opane .rules{padding:0}
.opane .possum{margin:0}
.opane .posbody{gap:10px}
.opane .possum .kv{margin:0}
.opane .possum .btn{align-self:flex-start}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.xlist{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.xo{display:grid;grid-template-columns:1fr auto auto;gap:8px 10px;align-items:center;font-size:13px}
.xo .xn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xo .v{font-weight:700}
.xo .xbuy{height:28px;padding:0 10px;border-radius:999px;background:var(--pill);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.xo .xbuy b{font-weight:600;opacity:.85}
.xo .xbuy:disabled{opacity:.5;cursor:default}
.xo .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--card-2);position:relative;overflow:hidden;margin-top:-2px}
.xo .bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--ink)}
.actfeed{padding-top:6px}
.actfeed .ai{padding:10px 0}
.bk-scroll{max-height:126px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;border-radius:8px}
.bk-scroll::-webkit-scrollbar{width:0;height:0;display:none}
.bk-scroll.asks{display:flex;flex-direction:column-reverse}  /* lowest ask sits by the spread and is what you see first */
.bk-scroll:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.side-l small{font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-3);margin-left:8px;font-size:11px}
.possum{display:flex;flex-direction:column;padding:0;margin:0 0 40px}
.posbody{display:flex;flex-direction:column;gap:16px}
.possum .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
/* the position reads as one table: header and rows are cells of a single grid, so a wider Sell button or a
   longer figure can never pull one row's columns out of line with the header's. Every column is at least
   max-content wide, so a six-figure holding widens its column instead of being clipped, and the panel
   switches to the stacked form on its own width — not the window's — once the table stops fitting. */
.possum{container-type:inline-size}
.postbl{display:grid;grid-template-columns:56px repeat(6,minmax(max-content,1fr)) auto;align-items:center;column-gap:16px}
.postbl .ph{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-bottom:10px;white-space:nowrap}
.postbl .ph.r,.postbl .pn{text-align:right}
.postbl .pn{font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;padding:10px 0}
.postbl .pn.pnow{font-weight:700;color:var(--ink);line-height:1.3}
.postbl .pdelta{display:none}
.postbl .pstack{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.postbl .pstack .d{font-size:12px}
.postbl .ps{align-self:center;padding:10px 0}
.postbl .pa{align-self:center;justify-self:end;padding:10px 0}
.postbl .pline{grid-column:1/-1;height:1px;background:var(--dash);margin:4px 0}
.postbl .pl{display:none}

@container (max-width:600px){
  .posbody{gap:8px}
  .postbl{grid-template-columns:minmax(0,1fr);column-gap:12px;row-gap:4px}
  .postbl .ph{display:none}
  .postbl .pn{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-weight:700;color:var(--ink)}
  .postbl .pn.ppnl{display:none}
  .postbl .pn.pnow>span:last-child{display:flex;flex-direction:column;align-items:flex-end}
  .postbl .pdelta{display:block;font-size:12px;font-weight:700;line-height:17px}
  .postbl .pl{display:inline;font-size:13px;font-weight:600;color:var(--ink-3);text-transform:none;letter-spacing:0}
  .postbl .ps{padding:0 0 6px}
  .postbl .pa{justify-self:end;padding:6px 0 0}
  .postbl .pline{margin:16px 0}
}
.pos-chips{display:inline-flex;align-items:center;gap:6px;margin-top:6px}   /* the whole group is Chip Size=Sm — the tinted pair and the neutral order count alike (Figma Outcome Row, 24 Sep 2026) */
.pos-chips:empty{display:none}
.chip.pc{height:var(--sizing-control-22);padding:0 var(--spacing-md);font-size:var(--typeface-size-caption_1);gap:3px}
.chip.lg{height:32px;padding:0 12px;font-size:14px;font-weight:700;line-height:1.3}

.otabs button .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 6px;border-radius:var(--r2);background:var(--card-2);font-size:12px;font-weight:700;margin-left:4px;color:var(--ink-2)}
.otabs button[aria-selected=true] .cnt{background:var(--pill);color:#fff}
/* Open Order Card (Figma 717:704): телефонная форма открытого ордера. Строка 1 — чип, сторона, Cancel;
   строка 2 — пары «исполнено / заказано» на той же трёхколоночной сетке, что и карточки истории. */
.ordcards{display:none}
.ordcard{border-top:1px solid var(--hairline)}
.ordcard:first-child{border-top:0}
.ordcard .l1{display:flex;align-items:center;gap:8px;padding:10px 0}
.ordcard .l1 .ty{font-size:13px;font-weight:600}
.ordcard .l1 .sell{margin-left:auto}
.ordcard .l2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:10px;font-size:12px}
.ordcard .l2 .pair b{font-weight:400}
.ordcard .l2 .pair i{color:var(--ink)}
.mini-t{width:100%;min-width:0;border-collapse:collapse;font-size:13px;margin-top:8px}
.mini-t th{padding:6px 10px;font-size:12px}.mini-t td{padding:9px 10px}
.spread{font-size:12px;color:var(--ink-3);text-align:center;padding:8px 0;border-top:1px dashed var(--hairline-2);border-bottom:1px dashed var(--hairline-2)}.spread b{color:var(--ink)}
.fine{font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px;line-height:1.5}
.fine.left{text-align:left}

/* trade panel */
.ev>aside{align-self:stretch}
.trade .seg{margin-bottom:12px}
.trade .yn{margin:0;gap:var(--spacing-sm)}   /* Yes/No Pair Size=Sm (Figma Trade Panel) */
.trade .yn button{height:40px}
.trade .lbl{margin-top:16px}
.trade .lblrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.trade .lblrow .lbl{margin:0}
.trade .otype{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--card-2)}
.trade .otype button{height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2)}
.trade .otype button[aria-pressed=true]{background:var(--pill);color:#fff}
.trade .lim .lbl{margin:0 0 4px;font-size:11px;line-height:16.5px}   /* Figma Limit grid: labels Bold 11/16.5, 2 above */
.trade .lim{display:grid;grid-template-columns:122px minmax(0,1fr);gap:8px;margin-top:8px;padding-top:2px}
/* limit: a compact price / shares pair under the amount — shares follow the amount and the price */
.trade .lim .amt{height:36px;padding:0 12px;border-radius:var(--r-14);gap:4px}
.trade .lim .amt input,.trade .lim .amt output{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:700 15px/1 var(--font);letter-spacing:0;outline:none;font-variant-numeric:tabular-nums}
.trade .lim .amt output{color:var(--ink)}
.trade .lim .amt span{font-size:13px;font-weight:600}
.trade .now{font-size:12px;color:var(--ink-3);margin-top:6px}
.trade{padding:19px;position:sticky;top:72px;background:var(--glass-pop)}   /* 1px бордера + 19 = 20 от внешнего края, как в Figma */
/* Trade Panel A (16 Sep 2026): Buy/Sell and the order-type select share the top row, a full-bleed
   rule under them, and the summary is one label row plus the figure. */
.trade .trow{display:flex;gap:24px;align-items:center}
.trade .trow .seg{flex:1;margin:0}
.otsel{position:relative;flex:none}
.ot-btn{height:44px;width:100px;padding:0 10px;border-radius:var(--r2);border:0;background:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);font-size:13px;font-weight:700;color:var(--ink-2);transition:box-shadow 200ms}
/* стекло только в открытом состоянии (Figma Order Type Select 664:1162); закрытый — подпись med_em, открытый — high_em,
   стрелка в обоих low_em */
.ot-btn[aria-expanded=true]{color:var(--ink);background:var(--glass-field);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ot-btn:hover{box-shadow:var(--shadow)}
.ot-btn svg{width:16px;height:16px;color:var(--ink-3);transition:transform 300ms var(--spring)}
.ot-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.ot-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:12;min-width:136px;background:var(--glass-pop);backdrop-filter:blur(24px) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(24px) saturate(var(--glass-sat));border:1px solid var(--hairline);border-radius:16px;padding:6px;box-shadow:var(--shadow-3);animation:in 300ms var(--spring)}
.ot-menu{display:flex;flex-direction:column;gap:2px;padding:7px}
.ot-menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:12px;font-size:14px;line-height:18px;font-weight:600;color:var(--ink-2)}
.ot-menu button:hover{background:rgba(8,11,15,.06);color:var(--ink)}
.ot-menu button[aria-selected=true]{color:var(--ink);background:var(--card-2)}
.tdiv{height:1px;background:var(--dash);margin:16px 0 15px}   /* компонент divider: 4/4 по ширине контента */
.trade .lblrow{margin-top:16px;height:28px}
.trade .lblrow+.amt{margin-top:8px}
.tbal{font-size:12px;color:var(--ink-3);white-space:nowrap}
.tbal b{font-weight:600;color:var(--ink-2)}
.sumA{padding-top:11px;margin:16px 0 14px;position:relative}
.sumA::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--dash)}
.sumA .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sumA .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sumA .p{font-size:12px;color:var(--ink-3);text-align:right}
.sumA .v{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:8px}
.sumA .sub{font-size:13px;font-weight:700;margin-top:2px}
.sumA .sub.up{color:var(--yes-text)}.sumA .sub.down{color:var(--no-text)}
.trade h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);margin:0}
.trade .handle{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card-2);padding:4px;border-radius:var(--r2)}
.seg button{height:36px;border-radius:var(--r2);font-weight:700;color:var(--ink-3);transition:all 300ms var(--spring)}
.seg button[aria-pressed=true]{background:var(--pill);color:#fff}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.amt{display:flex;align-items:center;gap:6px;border:1px solid var(--hairline-2);border-radius:var(--r-18);padding:9px 15px;background:var(--glass-field)}
.amt:focus-within{outline:2px solid var(--focus);outline-offset:3px}
.amt[aria-invalid=true],.amt.bad{border-color:var(--no-text)}
.amt span{font-size:22px;font-weight:600;color:var(--ink-3);line-height:1}
.amt input{flex:1;border:0;background:none;color:var(--ink);font:800 30px/1 var(--font);letter-spacing:-.03em;outline:none;min-width:0;width:100%;height:1em;padding:0;font-variant-numeric:tabular-nums}
.amt input::placeholder{color:var(--ink-3);opacity:1}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;height:32px;border-radius:var(--r2);background:var(--card-2);font-size:13px;font-weight:600;color:var(--ink-2);transition:transform 300ms var(--spring),background 200ms}
.chips button:disabled{opacity:.5;cursor:default;transform:none}
.chips button:hover{transform:translateY(-1px);color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--pill);color:#fff}
.sum{margin:14px 0;padding:12px 16px;border-radius:var(--r-18);background:var(--card-2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2)}.sum b{color:var(--ink);font-weight:700;text-align:right}
.sum .win{font-size:15px;align-items:baseline}.sum .win b{font-size:26px;letter-spacing:-.03em;font-weight:800}
.sum .sub{justify-content:flex-end;font-size:13px;font-weight:700;margin-top:-6px}
.sum .line{height:1px;background:var(--hairline);margin:4px 0}
.sum .sub.up{color:var(--yes-text)}.sum .sub.down{color:var(--no-text)}
.trade .btn.ink{width:100%;height:52px;font-size:16px;white-space:nowrap}
.trade .btn.ink.confirm{background:var(--pill-hover)}
.nopos{padding:16px 0 4px;color:var(--ink-2);font-size:14px;line-height:1.5}
.nopos a{display:inline-block;margin-top:6px;font-weight:600;color:var(--ink)}
.resolved{padding:4px 0}
.trade .resolved{padding:0;margin:0 0 12px}
.trade .kv{margin:0 0 12px}
.sumA.res{margin:var(--spacing-xl) 0 0;padding-top:11px}
.sumA.res .k{font-size:var(--typeface-size-overline);line-height:var(--typeface-line_height-overline)}   /* Overline/Strong */
.sumA.res .sub{margin-top:6px;font-weight:600;color:var(--ink-2)}
.resolved .tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}
/* Trading closed: the date sits in a Notice (Figma Notice 295:89), no longer in a disabled button (Figma Trade Panel
   «Mode=Closed», 25 Sep 2026). Its 26 above collapses with the status block's 12 into the variant's gap 26 */
.trade .tnotice{margin:var(--spacing-26) 0 0;padding:var(--spacing-xl) var(--spacing-xxl);border-radius:var(--r-14);background:var(--surface-disabled_base_em);box-shadow:inset 0 0 0 1px var(--outline-base_em);font-size:var(--typeface-size-caption_2);line-height:var(--typeface-line_height-caption_2);font-weight:var(--typeface-weight-primary-bold);color:var(--ink)}
/* a status block that ends the panel (Cancelled) keeps no space under it (Figma «Mode=Cancelled» is 90 tall) */
.trade .resolved:last-child{margin-bottom:0}
.resolved .tag i{width:10px;height:10px;border-radius:50%;background:var(--yes)}
.resolved .tag.no i{background:var(--no)}
.resolved p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.resolved p b{color:var(--ink);font-weight:700}
.resolved p+p{margin-top:8px}
/* Activity A3 (спека артефакта DUQ Activity A3, 20.09.2026): строка — заявка. Сверху рынок,
   под ним сторона, чип и время; справа сумма и средняя цена. Окно на семь строк. */
.awin{--pad:24px;max-height:426px;overflow:hidden auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--hairline-2) transparent;border-radius:8px;margin:0 calc(-1*var(--pad)) 0 0;padding-right:var(--pad);position:relative}
.awin::-webkit-scrollbar{width:6px}
.awin::-webkit-scrollbar-thumb{background:var(--hairline-2);border-radius:8px}
.awin::after{content:"";display:block;position:sticky;bottom:0;height:18px;margin:-18px calc(-1*var(--pad)) 0 0;pointer-events:none;opacity:0;transition:opacity 200ms;background:linear-gradient(transparent,var(--glass-pop)),linear-gradient(transparent,var(--bg))}
.awin[data-below]::after{opacity:1}
@container (max-width:460px){.awin{--pad:14px}}
.pulse{margin:0;padding:6px 0 0;list-style:none}
.pulse.stagger>*:nth-child(n+8){animation:none}
/* the feed is the position table: 11px header, 14px cells, rows padded 10/0 and parted by the dashed
   rule. Every row is its own grid on one fixed template — the way the order tables do it — so the
   columns line up down the list while a fresh trade can still be dropped in at the top. */
.arow{display:grid;grid-template-columns:minmax(0,1.6fr) 48px repeat(4,minmax(0,1fr));gap:16px;align-items:center;padding:10px 0;font-size:14px;font-weight:500;color:var(--ink-2)}
.arow>.r{text-align:right;white-space:nowrap}
.arow .an{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .aval{font-weight:700;color:var(--ink)}
.arow .aval abbr{text-decoration:none}
.arow .chip{justify-self:start}
/* the header reads like the position table's — no plate, no rule. It still sticks, so its ground is the
   card's own colour rebuilt opaquely (the card's glass over the page) and rows pass under it unseen. */
.arow.ahead{position:sticky;top:0;z-index:1;padding:0 0 10px;font-size:11px;line-height:16.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:linear-gradient(var(--card),var(--card)),linear-gradient(var(--bg),var(--bg))}
.acttbl .tline:last-child{display:none}
.arow.enter{animation:flash 1800ms ease-out}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ai{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--hairline);font-size:13px}
.ai:first-child{border-top:0}
.ai.enter{animation:rise 500ms var(--spring)}
.ai .who{font-weight:600}
.ai .what{color:var(--ink-2);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.ai .what .chip{height:20px;padding:0 6px;font-size:12px}
.ai .amt2{font-weight:700;text-align:right}.ai .amt2 small{display:block;font-size:12px;font-weight:600;color:var(--ink-3)}

/* the chart tooltip is a class: the event chart and every in-outcome chart share one styling */
.chartbox{position:relative}
.charttip{position:absolute;top:8px;pointer-events:none;background:rgba(14,17,23,.92);color:#fff;border-radius:var(--r-14);padding:10px 12px;font-size:12px;line-height:1.4;min-width:150px;box-shadow:0 12px 30px rgba(8,11,15,.25);transform:translateX(-50%);backdrop-filter:blur(8px);z-index:5}
.charttip b{display:block;font-size:12px;color:rgba(255,255,255,.7);font-weight:600;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.charttip div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.charttip div i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.charttip div span{display:flex;align-items:center}
.charttip div em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

/* outcome picker (select-only combobox) */
.dd{position:relative;margin:12px 0}
.dd-btn{width:100%;height:40px;border-radius:var(--r2);border:1px solid var(--hairline);background:var(--glass-field);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:0 13px;font-weight:600;font-size:14px;text-align:left;transition:box-shadow 200ms,transform 300ms var(--spring)}
.dd-btn:hover,.dd-btn[aria-expanded=true]{box-shadow:var(--shadow)}
.dd-btn .dot,.dd-menu .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dd-btn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn b{font-weight:700;font-variant-numeric:tabular-nums}
.dd-btn .car{flex:none;color:var(--ink-3);transition:transform 300ms var(--spring)}
.dd-btn[aria-expanded=true] .car{transform:rotate(180deg)}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:10;background:var(--glass-pop);backdrop-filter:blur(24px) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(24px) saturate(var(--glass-sat));border:1px solid var(--hairline);border-radius:var(--r-22);padding:6px;box-shadow:var(--shadow-3);animation:in 300ms var(--spring)}

/* toast + live status — A · Island, the user's pick of three styles (24 Sep 2026): a compact pill — a status disc, the
   title, the close. No description line and no action chip on any toast (the user, 24 Sep: «all toast without
   description text and action button»; Figma Toast 298:6514 hides both in every variant). Its ground is the system's floating glass (glass_pop under
   the pop blur, a hairline, the toast shadow), not the ink it started on — the user, 24 Sep: «not black». Four types (success · warning · error · info), at the top centre. Every colour, size, radius, gap and shadow is
   a system variable; the icons are the library's (Icon/Check, Icon/Close, Icon/Info — the Info glyph turned over is the
   warning «!»), each on a 16 disc, the size of Icon/Info's own, the glyph cut out in the surface colour. */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--spacing-5xl));z-index:60;transform:translateX(-50%);
  width:max-content;max-width:calc(100vw - 2 * var(--spacing-2xl));min-height:var(--sizing-control-xxxl);display:none;align-items:center;gap:var(--spacing-xl);
  padding:var(--spacing-md) var(--spacing-md) var(--spacing-md) var(--spacing-xxl);border-radius:var(--radius-border_radius_7xl);
  --t-bg:var(--surface-glass_pop);--t-line:var(--outline-low_em);--t-hi:var(--text-high_em);--t-md:var(--text-med_em);--t-cut:var(--surface-surface_1);
  --t-wash:var(--neutral_inverse_white-alpha_6);--t-ring:var(--focus);--t-disc:var(--text-success_med_em);
  background:var(--t-bg);backdrop-filter:blur(var(--blur-pop)) saturate(var(--glass-sat));-webkit-backdrop-filter:blur(var(--blur-pop)) saturate(var(--glass-sat));
  color:var(--t-hi);box-shadow:inset 0 0 0 var(--sizing-border-hairline) var(--t-line),var(--shadow-toast)}
.toast[data-type=warning]{--t-disc:var(--text-warning_med_em)}
.toast[data-type=error]{--t-disc:var(--text-danger_med_em)}
.toast[data-type=info]{--t-disc:var(--text-info_med_em)}
/* dark theme: the toast keeps its light face (the user, 24 Sep: «в тёмной теме тоже как в светлой») — the light values
   of the same tokens, from the primitives they point at, which do not turn; the glass is thicker (94 %) so it reads as
   light over a dark page as the 82 % does over a light one */
html[data-theme=dark] .toast{--t-bg:var(--color-white-94);--t-line:var(--color-black-8);--t-hi:var(--color-gray-900);--t-md:var(--color-gray-800);
  --t-cut:var(--color-white-100);--t-wash:var(--color-black-6);--t-ring:var(--color-dark-600);--t-disc:var(--color-success-600)}
html[data-theme=dark] .toast[data-type=warning]{--t-disc:var(--color-warning-600)}
html[data-theme=dark] .toast[data-type=error]{--t-disc:var(--color-danger-600)}
html[data-theme=dark] .toast[data-type=info]{--t-disc:var(--color-info-600)}
.toast.on{display:flex;animation:t-in 520ms var(--spring) both}
.toast.on.out{animation:t-out 300ms var(--ease) forwards}
@keyframes t-in{from{opacity:0;transform:translate(-50%,-24px) scale(.86)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes t-out{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-12px) scale(.94)}}
.toast .t-ic{flex:none;position:relative;display:grid;place-items:center;width:var(--sizing-icon-lg);height:var(--sizing-icon-lg);color:var(--t-disc)}
.toast .t-ic::before{content:"";position:absolute;inset:var(--spacing-xxs);border-radius:var(--radius-border_radius_round);background:currentColor}
.toast .t-ic svg{position:relative;display:block;color:var(--t-cut)}
.toast .t-ic svg:not(.i){width:100%;height:100%}
.toast .t-ic svg.i{width:var(--sizing-icon-xxs);height:var(--sizing-icon-xxs);stroke-width:2.5}
.toast[data-type=warning] .t-ic svg:not(.i){transform:rotate(180deg)}
.toast .t-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;overflow-wrap:anywhere}
.toast .t-h{font-family:var(--typeface-family-primary),var(--font);font-size:var(--typeface-size-title_1);line-height:var(--typeface-line_height-title_1);
  font-weight:var(--typeface-weight-primary-semibold);letter-spacing:var(--typeface-letter_spacing-xs)}
.toast .t-x{flex:none;display:grid;place-items:center;width:var(--sizing-control-xs);height:var(--sizing-control-xs);border-radius:var(--radius-border_radius_round);
  color:var(--t-md);transition:background 200ms,color 200ms}
.toast .t-x:hover{background:var(--t-wash);color:var(--t-hi)}
.toast .t-x svg.i{width:var(--sizing-icon-sm);height:var(--sizing-icon-sm)}
.toast .t-x:focus-visible{outline:var(--sizing-border-ring) solid var(--t-ring);outline-offset:var(--sizing-border-focus_gap);box-shadow:none}

    c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, W, H);   // transparent over the light layer
    for (var i = 0; i < N; i++) {
      var o = i * STRIDE, s = side[i];
      if (transit[i] && delay[i] > 0) s = fromSide[i];
      var key = (transit[i] && delay[i] <= 0) ? 'g' : (s === 1 ? 'y' : (s === -1 ? 'n' : 'g'));
      var sz = buf[o + 6];
      c.globalAlpha = Math.min(1, buf[o + 5]);
      c.drawImage(sprites[key], buf[o] - sz / 2, buf[o + 1] - sz / 2, sz, sz);
    }
    c.globalAlpha = 1;
  }
  function draw() { if (gl) drawGL(); else draw2D(); }

  /* ---------- the words: weight and colour from the same share, a plain crossfade ---------- */
  var WMIN = 400;
  function weightOf(v) { return WMIN + (1000 - WMIN) * Math.pow(v, 0.85); }
  function paintWord(word, v, e, pop) {
    var w = Math.round(lerp(700, weightOf(v), e));
    // the word's text tone at full share; at zero share the same tone faded to 45 % over the page
    var fill = lerp(1, Math.pow(v, 0.8), e);
    var col = mixRGB(word.faded, word.ct, Math.round(fill * 100) / 100);
    var st = word.v.style;
    if (w !== word.lastW) { st.fontVariationSettings = '"wght" ' + w; word.lastW = w; }
    if (col !== word.lastC) { st.color = col; word.lastC = col; }
    if (pop !== word.lastPop) { word.w.style.transform = pop ? 'scale(' + (1 + pop).toFixed(4) + ')' : ''; word.lastPop = pop; }
  }
  var lastQ = -1;
  function paintWords(st, e) {
    paintWord(words.yes, st.p, e, st.pop * (st.p > 0.5 ? 1 : 0));
    paintWord(words.no, 1 - st.p, e, st.pop * (st.p < 0.5 ? 1 : 0));
    var q = Math.round(st.q);
    if (q !== lastQ) { qmark.style.fontVariationSettings = '"wght" ' + q; lastQ = q; }
  }
  function setTheme(dark) {
    // dark: the crowd at rest is a lighter grey, the words fade toward the dark ground, their full tones are lifted
    GRAY = dark ? [0.66, 0.70, 0.75] : [0.549, 0.576, 0.612];
    PAGE255 = dark ? [11, 13, 18] : [240, 240, 245];
    words.yes.ct = dark ? [67, 217, 162] : WORDS.yes.ct;
    words.no.ct = dark ? [255, 118, 118] : WORDS.no.ct;
    words.yes.lastC = ''; words.no.lastC = '';
    goLive();
    if (sprites) makeSprites();
    if (!running && introDone) { draw(); paintWords(market(clock), 1); }
  }
  function goLive() {
    var keys = ['yes', 'no'];
    for (var i = 0; i < 2; i++) {
      var wd = words[keys[i]];
      wd.faded = [lerp(wd.ct[0], PAGE255[0], 0.55), lerp(wd.ct[1], PAGE255[1], 0.55), lerp(wd.ct[2], PAGE255[2], 0.55)];
    }
  }

  /* ---------- loop ---------- */
  var raf = 0, last = 0, acc = 0, running = false, introT = 0, introDone = false;
  function frame(now) {
    if (!running) return;
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    acc += dt;
    var steps = 0;
    updateFlow(simTime);
    while (acc >= 1 / 60 && steps < 3) { clock += 1 / 60; simFrom(market(clock)); acc -= 1 / 60; steps++; }
    if (acc > 1 / 60) acc = 0; // a long stall is dropped, not replayed
    if (steps) {
      draw();
      if (!introDone) { introT += dt; if (introT >= 0.8) introDone = true; }
      paintWords(market(clock), introDone ? 1 : easeOutCubic(clamp01(introT / 0.8)));
    }
    raf = requestAnimationFrame(frame);
  }
  function start() { if (running) return; running = true; last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); }
  function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

  /* ---------- input ---------- */
  function pointer(x, y) { mx = x; my = y; mouseSeen = 2.5; }
  function commit(sideYes) {
    var st = market(clock);
    if (st.tc >= SNAP_AT) return;                       // already decided this round
    st.info.winner = sideYes ? 1 : -1;
    st.info.pFrom = st.p;
    clock = st.cycle * CYCLE + SNAP_AT;                 // jump both the field and the words to the decision
  }
  function bindInput() {
    window.addEventListener('pointermove', function (e) { pointer(e.clientX, e.clientY); }, { passive: true });
    window.addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) pointer(t.clientX, t.clientY); }, { passive: true });
    document.addEventListener('mouseleave', function () { mouseSeen = 0; });
    window.addEventListener('click', function (e) {
      if (!document.body.classList.contains('is-landing')) return;
      if (e.target && e.target.closest && e.target.closest('a, button')) return;
      commit(e.clientX < (ax[0] + ax[1]) / 2);
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    if (!initGL()) { ctx2d = canvas.getContext('2d'); makeSprites(); }
    if (gl) { gl.viewport(0, 0, canvas.width, canvas.height); gl.uniform2f(uRes, W, H); gl.uniform1f(uDpr, dpr); }
    makeGrids();
    goLive();
    measureWordBoxes();
    measureLayout();
    allocate();
    // warm start: the first frame already shows the first odds of the loop, settled
    var p0 = pStart(0);
    seedIntoMasses(p0);
    pTarget = p0; phase = 'freeze';   // no trickle while warming up
    updateFlow(0);
    var i;
    for (i = 0; i < 60; i++) step();
    phase = 'drift';
    if (preroll > 0) {
      var frames = Math.min(600 * 60, Math.round(preroll * 60));
      for (i = 0; i < frames; i++) {
        clock += 1 / 60; if (i % 4 === 0) updateFlow(simTime); simFrom(market(clock));
        if (debug && i % 60 === 0) debug.push([Math.round(clock), phase, aliveCount(0), Math.round(mcx[0]), Math.round(mcy[0]), Math.round(mR[0]), aliveCount(1), Math.round(mcx[1]), Math.round(mcy[1]), Math.round(mR[1]), yesCount, noCount, NM - yesCount - noCount].join(' '));
      }
      if (debug) { var pre = document.createElement('pre'); pre.id = 'debug'; pre.hidden = true; pre.textContent = 'NM ' + NM + ' N ' + N + ' Rbase ' + Math.round(Rbase) + ' narrow ' + narrow + ' block ' + [Math.round(bL), Math.round(bT), Math.round(bR), Math.round(bB)].join(' ') + '\n' + debug.join('\n'); document.body.appendChild(pre); }
      introDone = true;
    }
    draw();
    paintWords(market(clock), (preroll > 0 || reduced) ? 1 : 0);
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { measureWordBoxes(); resize(); if (!running) draw(); }, 120); });
    // the app owns the loop: it starts the field only while the landing is shown and live updates are on
    window.duqField = {
      start: function () { if (!reduced && !holdFrame) start(); },
      stop: stop,
      commit: commit,
      setTheme: setTheme
    };
    if (document.documentElement.dataset.theme === 'dark') setTheme(true);
    if (reduced || holdFrame) return;                 // a complete still frame, nothing moves
    bindInput();
    if (!window.duqLive || window.duqLive()) start();
    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if (!window.duqLive || window.duqLive()) start(); });
  // the first measurement can run before the web font (or the view) is ready: measure again a little later
  [300, 1200, 3000].forEach(function (ms) { setTimeout(function () { measureWordBoxes(); resize(); if (!running) draw(); }, ms); });
  }

  var booted = false;
  if (document.fonts && document.fonts.ready) {
    // re-measure once the real font is in; boot right away regardless
    document.fonts.ready.then(function () { if (!booted) return; measureWordBoxes(); measureLayout(); if (!running) { for (var i = 0; i < 40; i++) step(); draw(); } });
  }
  // the page can be created at zero size (an iframe sized after load): wait for a real viewport, or the crowd is laid out into nothing
  var waited = 0;
  function bootWhenSized() {
    if (booted) return;
    // boot anyway after ~3s: a degraded field beats no field at all
    if ((window.innerWidth > 1 && window.innerHeight > 1) || waited > 3000) { booted = true; window.removeEventListener('resize', bootWhenSized); boot(); }
    else { waited += 120; setTimeout(bootWhenSized, 120); }
  }
  window.addEventListener('resize', bootWhenSized);
  bootWhenSized();
})();
</script>
